name: Azure Static Web Apps CI/CD

on:
  # Lets a deploy be re-run by hand. On 26 Aug 2026 a push to main landed on
  # GitHub but no workflow run was ever created for it, leaving the site a
  # commit behind with nothing to click. Without this the only remedy is to
  # invent another commit.
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Build and publish
        run: dotnet publish SmartGirlAlgebra/SmartGirlAlgebra.csproj -c Release -o ./output

      # Stamp the commit into the published site so a deploy can be PROVEN rather
      # than assumed. Without this there is no way to tell a live site running
      # this build from one running last week's - "Actions went green" only says
      # the upload started, not what is being served.
      - name: Stamp the build
        run: |
          mkdir -p ./output/wwwroot
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "$SHORT" > ./output/wwwroot/version.txt
          echo "{\"commit\":\"$GITHUB_SHA\",\"commitShort\":\"$SHORT\",\"built\":\"$BUILT\",\"ref\":\"$GITHUB_REF_NAME\"}" > ./output/wwwroot/buildinfo.json
          cat ./output/wwwroot/version.txt
          cat ./output/wwwroot/buildinfo.json

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_RIVER_0E368941 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          app_location: "output/wwwroot"
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_RIVER_0E368941 }}
          action: "close"
